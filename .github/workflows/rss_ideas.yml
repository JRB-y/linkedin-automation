name: RSS → Notion Ideas

on:
  schedule:
    - cron: "0 7 * * 1,4" # Every Monday and Thursday at 7:00 UTC
  workflow_dispatch:
    inputs:
      recency_days:
        description: "Fetch articles from the last N days"
        type: number
        default: 4
      max_ideas:
        description: "Number of ideas to generate"
        type: number
        default: 5

permissions:
  contents: write

jobs:
  rss-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS and create Notion drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          RSS_RECENCY_DAYS: ${{ github.event.inputs.recency_days || 4 }}
          RSS_MAX_IDEAS: ${{ github.event.inputs.max_ideas || 5 }}
        run: node src/rssToIdeas.js

      - name: Commit seen articles cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen articles cache [skip ci]"
            git push
          fi
